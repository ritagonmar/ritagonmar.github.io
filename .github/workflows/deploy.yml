name: Deploy MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Build site
        run: uv run mkdocs build

      - name: Deploy to GitHub Pages
        run: uv run mkdocs gh-deploy --force
